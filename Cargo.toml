[workspace]
members = ["crates/cli", "crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
notify = "8"
openspec-doc-core = { path = "crates/core" }
openspec-doc-server = { path = "crates/server" }
# `debug-embed` so a debug build and a test embed the assets the way a release
# build does, rather than reading `web/dist` off disk at run time.
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
