# Versioning, binaries and GitHub releases are one workflow run. A tag created
# with GITHUB_TOKEN does not trigger another workflow, so release follow-up jobs
# depend on this run's release-plz output rather than on `push.tags` — and the
# failure of doing otherwise is silent: a tag, an empty release, no failed job.
#
# release-plz creates the release as a draft (release-plz.toml). `publish` is
# the release's commit point: it undrafts only after every platform leg has
# attached its archive, so a failed leg leaves a draft nobody can install
# rather than a published release missing a platform.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pull-request:
    name: Release pull request
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.cli.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Omitting `command` intentionally runs release-pr and release in sequence:
      # open/update the proposal first, then release only after that proposal is
      # merged. Downstream artifact jobs gate on the CLI tag below.
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Core and server receive internal tags but no GitHub release; the CLI's
      # tag is the release the binaries attach to. The crates share one
      # workspace version, so a release without the CLI in it is not a state
      # this workflow knows how to finish.
      - name: Find the CLI release tag
        id: cli
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "openspec-doc-cli") | .tag')
          if [ -z "$tag" ]; then
            echo "::error::release-plz released packages but not openspec-doc-cli: $RELEASES" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # One dashboard build per release, handed to every platform leg, so each
  # binary embeds the same bytes: `vue-tsc`, Vite, and a per-runner dependency
  # tree are three places for two builds of one commit to differ.
  frontend:
    name: build the embedded frontend once
    needs: release-pull-request
    if: needs.release-pull-request.outputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile
        working-directory: web

      - run: bun run build
        working-directory: web

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.target }}
    needs: [release-pull-request, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on the arm runner too: only `rustup target add`, no linker
          # configuration. Smoke-tested under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl and statically linked, so a binary fetched by `curl` does not
          # carry this runner's glibc floor onto an older distribution. Every
          # workspace dependency is pure Rust, so no musl C toolchain is needed.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # x86_64-pc-windows-msvc is blocked on
          # replace-hook-shell-form-with-exec-form: until it lands, `doctor`
          # on Windows cannot find `openspec-doc.exe` on PATH.

    env:
      TAG: ${{ needs.release-pull-request.outputs.tag }}
      ARCHIVE: openspec-doc-${{ matrix.target }}.tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      # An absent dist is a compile error, but an empty one compiles and the
      # binary panics on the first request for the shell. A release binary is
      # the worst place for that to surface, so neither gets as far as cargo.
      - name: Fail if the frontend artifact did not arrive
        run: |
          if [ ! -d web/dist ] || [ -z "$(ls -A web/dist)" ]; then
            echo "::error::web/dist is missing or empty after downloading the web-dist artifact from the frontend job. A release binary cannot be built without it." >&2
            exit 1
          fi

      # The toolchain is pinned in rust-toolchain.toml; the target is added to
      # that toolchain rather than listed there, so contributors do not download
      # four standard libraries they never build for.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}

      # The default release profile, deliberately. Measured on
      # x86_64-unknown-linux-musl: 6.0 MB and ~35 s clean. `strip = true` saves
      # 1 MB and costs the symbol names in panic backtraces; fat LTO saves
      # another 0.7 MB for ~60% more build time. Neither is worth it for a
      # local tool downloaded once. No cache: this is what users receive, built
      # from a clean checkout.
      - run: cargo build --locked --release --target ${{ matrix.target }} -p openspec-doc-cli

      # A musl target that silently linked dynamically is the failure the target
      # choice exists to prevent, and it does not announce itself.
      - name: Confirm the binary is static and runs on an older distribution
        if: contains(matrix.target, 'linux-musl')
        run: |
          bin=target/${{ matrix.target }}/release/openspec-doc
          linkage=$(ldd "$bin" 2>&1 || true)
          case "$linkage" in
            *"statically linked"* | *"not a dynamic executable"*) ;;
            *) echo "::error::$bin is dynamically linked: $linkage" >&2; exit 1 ;;
          esac
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/b:ro" debian:buster /b/openspec-doc --version

      - name: Confirm the binary serves the embedded dashboard
        run: scripts/smoke-release-binary.sh target/${{ matrix.target }}/release/openspec-doc

      - name: Archive and checksum
        run: |
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release openspec-doc
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: publish the release
    needs: [release-pull-request, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-pull-request.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Served from the release it installs, never from a branch: a branch URL
      # pins every install to an unreviewed commit.
      - run: gh release upload "$TAG" install.sh --clobber --repo "$GITHUB_REPOSITORY"

      # Undrafting a release whose tag does not exist yet creates the tag at the
      # default branch's head, which need not be the commit the binaries were
      # built from.
      - name: Confirm the tag names the commit that was built
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha) || {
            echo "::error::tag $TAG does not exist; refusing to undraft, which would create it at the default branch's head" >&2
            exit 1
          }
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG names $tagged but the binaries were built from $GITHUB_SHA" >&2
            exit 1
          fi

      - run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
