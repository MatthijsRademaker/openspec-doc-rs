# The workspace's own gates, run on every change rather than when someone
# remembers to run them.
#
# This lane invokes the Makefile, not `cargo`. Spelling the commands out here
# would create a second definition of what "checked" means, and the two copies
# do not drift symmetrically: a gate added to the Makefile and not here leaves
# this workflow green for a surface nobody is checking. If a `cargo` invocation
# appears below, that decision has been reversed and
# openspec/changes/add-continuous-verification/design.md is what needs
# revisiting, not this file.
#
# Covered platforms are Linux and macOS. Windows is deliberately absent — see
# docs/docs/development/testing.md for which tests a Windows leg would silently
# omit and why a green one would be a false claim.
name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # web/dist is gitignored and embedded at compile time, so every platform leg
  # needs one. Built once here and handed to each leg, so all of them embed the
  # same bytes: `vue-tsc`, Vite, and a per-runner dependency tree are three
  # places for two builds of one commit to differ.
  frontend:
    name: build the embedded frontend once
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile
        working-directory: web

      - run: bun run build
        working-directory: web

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  gates:
    name: gates on ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `make check` runs the frontend and docs gates too, so this job needs Bun
      # even though it does not build web/dist.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      # The artifact is a hard dependency. Without this, an absent one surfaces
      # as a cargo error about an unreadable embed folder, which reads like a
      # source problem rather than a missing upstream job.
      - name: Fail if the frontend artifact did not arrive
        run: |
          if [ ! -d web/dist ] || [ -z "$(ls -A web/dist)" ]; then
            echo "::error::web/dist is missing or empty after downloading the web-dist artifact from the frontend job. The workspace cannot be compiled without it." >&2
            exit 1
          fi

      # The frontend lane is deliberately uncached because it proves a clean
      # checkout builds. This job proves the code compiles and passes, which a
      # cache does not stand in for, so it caches per platform.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `make check` runs `bun run check` in web, which needs node_modules. It
      # does not touch web/dist, so the downloaded artifact is what gets
      # embedded.
      - run: bun install --frozen-lockfile
        working-directory: web

      # `scratch::promote` runs `openspec validate` as a subprocess, and two
      # `hook stop` tests assert on what it reported. They are the suite's only
      # non-hermetic tests, so without this the run fails on both platforms.
      # Skipping them instead would be the green-run-that-omitted-the-tests
      # failure this lane exists to remove. Pinned, because their assertions
      # read its output.
      - name: Install the openspec CLI the promotion tests shell out to
        run: bun add --global @fission-ai/openspec@1.3.1

      - run: make check

      - run: make test
