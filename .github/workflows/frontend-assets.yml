# `web/dist/` is committed so that `cargo install` needs no JavaScript toolchain.
# That trade is only safe with this check: without it a stale `dist/` ships an
# interface that does not match its source, and does it silently.
name: Frontend assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dist-is-current:
    name: web/dist matches a clean build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No dependency cache and no `node_modules` restored from anywhere: the
      # point is a build unaffected by any prior state, since a cached one would
      # verify the cache rather than the source.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - name: Fail if the committed assets are stale
        run: |
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::web/dist is stale: a clean build differs from the committed assets. Run 'bun install --frozen-lockfile && bun run build' in web/ and commit the result."
            # --porcelain, not just the diff: an untracked freshly hashed bundle
            # is drift too, and only status reports it.
            git status --porcelain -- .
            # --stat, not the diff itself: a minified bundle's content diff is
            # noise, and which files moved is the whole answer.
            git diff --stat -- .
            exit 1
          fi

      - name: Install Chromium for embedded browser verification
        run: bunx --bun playwright install --with-deps chromium

      - name: Verify embedded application in a real browser
        run: bun run test:e2e

      - name: Check mirrored Pi and Claude skills
        working-directory: .
        run: bun scripts/check-harness-resources.mjs
