# `web/dist/` is a gitignored build artifact: crates/server embeds whatever the
# local build produced at compile time (rust-embed). This lane proves a clean
# checkout can build the frontend, embed it, and serve it in a real browser.
name: Frontend assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lane:
    name: clean build embeds and serves
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No dependency cache and no `node_modules` restored from anywhere: the
      # point is a build unaffected by any prior state, since a cached one would
      # verify the cache rather than the source.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - name: Install Chromium for embedded browser verification
        run: bunx --bun playwright install --with-deps chromium

      - name: Verify embedded application in a real browser
        run: bun run test:e2e

      - name: Check mirrored Pi and Claude skills
        working-directory: .
        run: bun scripts/check-harness-resources.mjs
