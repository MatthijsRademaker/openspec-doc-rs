<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1280" viewBox="0 0 1040 1280" role="img" aria-labelledby="title desc">
  <title id="title">scope review workbench narrow reference, light and dark</title>
  <desc id="desc">Two narrow review panels place document content before full-width reviewer and agent threads, with verdict and delivery reachable in normal flow.</desc>
  <defs><style>text{font-family:'IBM Plex Sans Variable',sans-serif}.mono{font-family:'IBM Plex Mono',monospace}.label{font-size:10px;letter-spacing:1.1px}.title{font-size:18px;font-weight:600}.h2{font-size:15px;font-weight:600}.body{font-size:12px}.small{font-size:10px}.comment{font-size:11px}</style></defs>
  <rect width="1040" height="1280" fill="#e9e8e5"/>
  <g transform="translate(32 32)">
    <rect width="468" height="1216" rx="18" fill="#fafaf9" stroke="#d4d4d0"/>
    <g transform="translate(22 26)" fill="#202322">
      <text class="label" fill="#7a4a10">LIGHT / NARROW</text><text y="34" class="title">Add dashboard development</text><text y="56" class="title">harness</text>
      <text y="82" class="mono small" fill="#626865">add-dashboard-development-</text><text y="97" class="mono small" fill="#626865">harness</text>
      <rect y="116" width="122" height="24" rx="12" fill="#f4e4ae"/><text x="12" y="132" class="small" fill="#725414">5 open comments</text><rect x="130" y="116" width="126" height="24" rx="12" fill="#e8ddf2"/><text x="142" y="132" class="small" fill="#5d3c75">keep exploring</text>
      <line y1="164" x2="424" y2="164" stroke="#d4d4d0"/>
      <text y="198" class="label" fill="#626865">PROPOSAL · WHY</text><text y="228" class="h2">Bounded review loop</text><text y="254" class="body">Artifact content remains primary on</text><text y="272" class="body">a narrow screen.</text>
      <rect y="296" width="424" height="126" rx="9" fill="#f3f0eb" stroke="#e0d7ca"/><text x="14" y="320" class="label" fill="#8a5a20">REVIEWER · OPEN</text><text x="14" y="348" class="comment">“Show the exact block this comment refers to.”</text><text x="14" y="374" class="small" fill="#626865">14m ago · paragraph 2</text><text x="14" y="400" class="small" fill="#8a5a20">Open · needs agent response</text>
      <text y="466" class="label" fill="#626865">DESIGN · RESPONSIVE</text><text y="496" class="h2">Comments follow their anchor</text><text y="522" class="body">No side rail clips the document. The</text><text y="540" class="body">identifier wraps inside its own block.</text>
      <rect y="566" width="424" height="126" rx="9" fill="#e9f0f5" stroke="#cbdce9"/><text x="14" y="590" class="label" fill="#315d7c">AGENT · ADDRESSED</text><text x="14" y="618" class="comment">“Inline anchor added.”</text><text x="14" y="644" class="small" fill="#626865">6m ago · evidence attached</text><text x="14" y="670" class="small" fill="#315d7c">Addressed</text>
      <rect y="724" width="424" height="90" rx="9" fill="#fff" stroke="#d4d4d0"/><text x="14" y="750" class="label" fill="#626865">DELIVERY · DELIVERED</text><text x="14" y="778" class="body">directive/2026-08-06T17:04:11Z</text><text x="14" y="798" class="small" fill="#626865">Status remains readable before actions.</text>
      <rect y="846" width="424" height="56" rx="9" fill="#e8ddf2"/><text x="14" y="880" class="label" fill="#5d3c75">VERDICT · KEEP EXPLORING</text>
    </g>
  </g>
  <g transform="translate(540 32)">
    <rect width="468" height="1216" rx="18" fill="#171918" stroke="#3b403e"/>
    <g transform="translate(22 26)" fill="#f1f2ef">
      <text class="label" fill="#e3b667">DARK / NARROW</text><text y="34" class="title">Add dashboard development</text><text y="56" class="title">harness</text>
      <text y="82" class="mono small" fill="#aeb5b1">add-dashboard-development-</text><text y="97" class="mono small" fill="#aeb5b1">harness</text>
      <rect y="116" width="122" height="24" rx="12" fill="#55451f"/><text x="12" y="132" class="small" fill="#f0d38d">5 open comments</text><rect x="130" y="116" width="126" height="24" rx="12" fill="#493956"/><text x="142" y="132" class="small" fill="#dbc4ee">keep exploring</text>
      <line y1="164" x2="424" y2="164" stroke="#3b403e"/>
      <text y="198" class="label" fill="#aeb5b1">PROPOSAL · WHY</text><text y="228" class="h2">Bounded review loop</text><text y="254" class="body">Artifact content remains primary on</text><text y="272" class="body">a narrow screen.</text>
      <rect y="296" width="424" height="126" rx="9" fill="#302923" stroke="#574734"/><text x="14" y="320" class="label" fill="#e2b979">REVIEWER · OPEN</text><text x="14" y="348" class="comment">“Show the exact block this comment refers to.”</text><text x="14" y="374" class="small" fill="#aeb5b1">14m ago · paragraph 2</text><text x="14" y="400" class="small" fill="#e2b979">Open · needs agent response</text>
      <text y="466" class="label" fill="#aeb5b1">DESIGN · RESPONSIVE</text><text y="496" class="h2">Comments follow their anchor</text><text y="522" class="body">No side rail clips the document. The</text><text y="540" class="body">identifier wraps inside its own block.</text>
      <rect y="566" width="424" height="126" rx="9" fill="#22303a" stroke="#365267"/><text x="14" y="590" class="label" fill="#b9d6eb">AGENT · ADDRESSED</text><text x="14" y="618" class="comment">“Inline anchor added.”</text><text x="14" y="644" class="small" fill="#aeb5b1">6m ago · evidence attached</text><text x="14" y="670" class="small" fill="#b9d6eb">Addressed</text>
      <rect y="724" width="424" height="90" rx="9" fill="#202422" stroke="#414844"/><text x="14" y="750" class="label" fill="#aeb5b1">DELIVERY · DELIVERED</text><text x="14" y="778" class="body">directive/2026-08-06T17:04:11Z</text><text x="14" y="798" class="small" fill="#aeb5b1">Status remains readable before actions.</text>
      <rect y="846" width="424" height="56" rx="9" fill="#493956"/><text x="14" y="880" class="label" fill="#dbc4ee">VERDICT · KEEP EXPLORING</text>
    </g>
  </g>
</svg>
